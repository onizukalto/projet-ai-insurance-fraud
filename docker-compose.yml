version: "3.9"

# ==========================================================
# AI INSURANCE RISK & FRAUD PLATFORM - docker-compose.yml
# ==========================================================
# Services :
#  - postgres        : base de données partagée (Airflow + MLflow)
#  - airflow-init     : initialise la base Airflow (compte admin, migrations)
#  - airflow-webserver : interface web Airflow (http://localhost:8080)
#  - airflow-scheduler : exécute les DAGs planifiés
#  - mlflow            : serveur de tracking + registre de modèles (http://localhost:5000)
#  - api               : API FastAPI qui sert les prédictions (http://localhost:8000)
#  - prometheus        : collecte des métriques (http://localhost:9090)
#  - grafana           : dashboards de monitoring (http://localhost:3000)
# ==========================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./src:/opt/airflow/src
    - ./spark_jobs:/opt/airflow/spark_jobs
  depends_on:
    - postgres

services:

  # ---------------- DATABASE ----------------
  postgres:
    image: postgres:15
    container_name: insurance_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_MULTIPLE_DATABASES: "airflow,mlflow"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # ---------------- AIRFLOW ----------------
  airflow-init:
    <<: *airflow-common
    container_name: insurance_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: insurance_airflow_web
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: insurance_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-init

  # ---------------- MLFLOW ----------------
  mlflow:
    build:
      context: ./mlflow
    container_name: insurance_mlflow
    ports:
      - "5001:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://airflow:airflow@postgres/mlflow
      MLFLOW_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  # ---------------- API ----------------
  api:
    build:
      context: ./api
    container_name: insurance_api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./api:/app
      - ./src:/app/src
    depends_on:
      - mlflow

  # ---------------- MONITORING ----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: insurance_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: insurance_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_artifacts:
  grafana_data:
